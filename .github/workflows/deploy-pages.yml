name: Deploy compiled app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: compiled-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for legacy Pages deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["REPOSITORY"]
          sha = os.environ["COMMIT_SHA"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=20"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "compiled-pages-waiter",
          }

          started = time.time()
          deadline = started + 150

          while time.time() < deadline:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = json.load(response)

              legacy = [
                  run for run in data.get("workflow_runs", [])
                  if run.get("event") == "dynamic"
                  and run.get("name") == "pages build and deployment"
                  and run.get("head_sha") == sha
              ]

              if legacy:
                  statuses = [(run.get("status"), run.get("conclusion")) for run in legacy]
                  print(f"Legacy Pages run: {statuses}", flush=True)
                  if all(run.get("status") == "completed" for run in legacy):
                      print("Legacy Pages deployment completed; continuing with compiled deploy.", flush=True)
                      break
              elif time.time() - started > 15:
                  print("No legacy Pages run found; continuing.", flush=True)
                  break

              time.sleep(3)
          else:
              print("Legacy Pages wait timed out; continuing with compiled deploy.", flush=True)
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy compiled site
        id: deployment
        uses: actions/deploy-pages@v4
